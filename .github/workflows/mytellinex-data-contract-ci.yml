name: MyTellinex Data Contract CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [test/mytellinex-account-billing-adapter]

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test tests/accountBilling.contract.test.mjs
      - run: npm ci
      - run: npm run build
