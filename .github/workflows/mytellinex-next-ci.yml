name: MyTellinex Next CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: legacy-default
            next_flag: "false"
            live_account_billing: "false"
            live_service: "false"
            live_support: "false"
          - name: next-prototype
            next_flag: "true"
            live_account_billing: "false"
            live_service: "false"
            live_support: "false"
          - name: next-live-account-billing
            next_flag: "true"
            live_account_billing: "true"
            live_service: "false"
            live_support: "false"
          - name: next-live-service
            next_flag: "true"
            live_account_billing: "false"
            live_service: "true"
            live_support: "false"
          - name: next-live-support
            next_flag: "true"
            live_account_billing: "false"
            live_service: "false"
            live_support: "true"
    name: build-${{ matrix.name }}
    env:
      VITE_MYTELLINEX_NEXT: ${{ matrix.next_flag }}
      VITE_MYTELLINEX_LIVE_ACCOUNT_BILLING: ${{ matrix.live_account_billing }}
      VITE_MYTELLINEX_LIVE_SERVICE: ${{ matrix.live_service }}
      VITE_MYTELLINEX_LIVE_SUPPORT: ${{ matrix.live_support }}
      VITE_SUPABASE_URL: https://preview-build.invalid.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_preview_build_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
