name: MyTellinex Next CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/mytellinex-txs-foundation]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        next_flag: ["false", "true"]
    env:
      VITE_MYTELLINEX_NEXT: ${{ matrix.next_flag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
