name: Pin Supabase SDK

on:
  push:
    branches: [feat/mytellinex-supabase-client]

permissions:
  contents: write

jobs:
  pin-sdk:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mytellinex-supabase-client
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve and pin current stable supabase-js
        run: |
          VERSION=$(npm view @supabase/supabase-js version)
          echo "Pinning @supabase/supabase-js@$VERSION"
          npm install --save-exact @supabase/supabase-js@$VERSION
          npm audit signatures
      - name: Commit package metadata and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: pin supabase-js and lock dependencies" || exit 0
          git push origin HEAD:feat/mytellinex-supabase-client
