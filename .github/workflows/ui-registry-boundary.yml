name: UI Registry Boundary

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Reject direct 21st.dev product imports
        run: node scripts/check-ui-registry-boundary.mjs
      - name: Verify approved registry blobs and consumers
        run: node scripts/check-ui-registry-adoption.mjs
      - name: Verify governed support mutation feedback
        run: node scripts/check-support-feedback-contract.mjs
