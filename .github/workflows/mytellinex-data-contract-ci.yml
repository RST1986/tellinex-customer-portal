name: MyTellinex Data Contract CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feat/**'

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: node --test tests/*.test.mjs
      - run: npm run build
